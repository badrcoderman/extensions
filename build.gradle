plugins {
    id 'com.android.application' version '8.6.1' apply false
    id 'org.jetbrains.kotlin.android' version '1.7.21' apply false
}

def requestedSources = new groovy.json.JsonSlurper().parse(file('sources.json'))
tasks.register('verifyExtensions') {
    dependsOn requestedSources.collectMany { [":src:ar:${it.slug}:testReleaseUnitTest", ":src:ar:${it.slug}:lintRelease"] }
}
tasks.register('buildExtensions') {
    dependsOn requestedSources.collectMany { [":src:ar:${it.slug}:assembleRelease", ":src:ar:${it.slug}:extensionJar"] }
}
if (findProject(':sandbox') != null) {
    tasks.register('verifySandbox') { dependsOn ':sandbox:testReleaseUnitTest', ':sandbox:lintRelease' }
    tasks.register('buildSandbox') { dependsOn ':sandbox:assembleRelease', ':sandbox:extensionJar' }
}
