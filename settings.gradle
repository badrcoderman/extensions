pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

rootProject.name = 'ArabicExtensions'
new groovy.json.JsonSlurper().parse(file('sources.json')).each { source ->
    include ":src:ar:${source.slug}"
}
// Laboratory packages are built explicitly and never enter the reader repository index.
if (providers.gradleProperty('includeSandbox').isPresent()) include ':sandbox'
